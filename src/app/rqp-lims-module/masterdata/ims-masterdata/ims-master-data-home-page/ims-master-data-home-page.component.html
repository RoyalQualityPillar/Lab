<div style="margin-top: 5px; margin-left: 5px">
  <mat-grid-list cols="4" rowHeight="3:1">
    <mat-grid-tile>
      <button mat-raised-button class="tile-view" (click)=" onInstrumentCategory()">
        Instrument Category
      </button>
    </mat-grid-tile>
    <mat-grid-tile>
      <button mat-raised-button class="tile-view" (click)=" onInstrumentMaster()">
        Instrument Master
      </button>
    </mat-grid-tile>
    <mat-grid-tile>
      <button mat-raised-button class="tile-view" (click)=" onCalibrationSchedule()">
        Calibration Schedule
      </button>
    </mat-grid-tile>

    <mat-grid-tile>
      <button mat-raised-button class="tile-view" (click)=" onCalibrationFrequency()">
        Calibration Frequency
      </button>
    </mat-grid-tile>

    <mat-grid-tile>
      <button mat-raised-button class="tile-view" (click)=" onCalibrationRecordSchedule()">
        Calibration Record Schedule
      </button>
    </mat-grid-tile>
    <mat-grid-tile>
      <button mat-raised-button class="tile-view" (click)=" onSampleSetMaster()">
        Sample Set Master
      </button>
    </mat-grid-tile>
    <mat-grid-tile>
      <button mat-raised-button class="tile-view" (click)=" onSampleRunMaster()">
        Sample Run Master
      </button>
    </mat-grid-tile>
    <mat-grid-tile>
      <button mat-raised-button class="tile-view" (click)=" onMethodMaster()">
        Method Master
      </button>
    </mat-grid-tile>
    <mat-grid-tile>
      <button mat-raised-button class="tile-view" (click)=" onUserMaster()">
        User Master
      </button>
    </mat-grid-tile>
    <mat-grid-tile>
      <button mat-raised-button class="tile-view" (click)=" onEvenLogMaster()">
        Even Log Master
      </button>
    </mat-grid-tile>
       <mat-grid-tile>
      <button mat-raised-button class="tile-view" (click)="onallStagesRecord()">
        All Stages Records
      </button>
    </mat-grid-tile>
  </mat-grid-list>
</div>
