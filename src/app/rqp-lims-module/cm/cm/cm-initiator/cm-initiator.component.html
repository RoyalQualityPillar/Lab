<form [formGroup]="HeaderForm">
  <div class="row no-gutters ms-1 me-1 dense-4">
    <mat-form-field appearance="outline" class="col-3 px-1">
      <mat-label>Product Name</mat-label>
      <input type="text" matInput formControlName="productName" placeholder="Product Name" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="col-3 px-1">
      <mat-label>Market</mat-label>
      <input type="text" matInput formControlName="market" placeholder="Market" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="col-3 px-1">
      <mat-label>Product Code</mat-label>
      <input type="text" matInput formControlName="productCode" placeholder="Product Code" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="col-3 px-1">
      <mat-label>UOM</mat-label>
      <input type="text" matInput formControlName="uom" placeholder="UOM" />
    </mat-form-field>
  </div>

  <div class="row no-gutters ms-1 me-1 dense-4">
    <mat-form-field appearance="outline" class="col-3 px-1">
      <mat-label>Shelf Life in Months</mat-label>
      <input type="text" matInput formControlName="shelfLifeMonths" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="col-3 px-1">
      <mat-label>Product Type</mat-label>
      <input type="text" matInput formControlName="productType" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="col-3 px-1">
      <mat-label>Dosage Form</mat-label>
      <input type="text" matInput formControlName="dosageForm" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="col-3 px-1">
      <mat-label>Input Code</mat-label>
      <input type="text" matInput formControlName="inputCode" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="col-3 px-1">
      <mat-label>Product Tracking Code</mat-label>
      <input type="text" matInput formControlName="productTrackingCode" />
    </mat-form-field>

    <div *ngIf="pageData.pageName == 'qt-review' || pageData.pageName == 'qtUpdateDetail'" class="col-3 px-1">
      <mat-form-field appearance="outline" class="col-12">
        <mat-label>Request No</mat-label>
        <input type="text" matInput formControlName="requestNo" />
      </mat-form-field>
    </div>
  </div>

  <div *ngIf="pageData.pageName == 'qt-review' || pageData.pageName == 'qtUpdateDetail'"
    class="row no-gutters ms-1 me-1 dense-4">
    <mat-form-field appearance="outline" class="col-3 px-1">
      <mat-label>Request Version</mat-label>
      <input type="text" matInput formControlName="version" />
    </mat-form-field>
  </div>
</form>

<!-- Attachment Details (UNCHANGED) -->
<app-common-title [title]="'Attachment Details'"></app-common-title>

<div class="">
  <div class="example-input-container">
    <form [formGroup]="UserRequirementForm">
      <div class="row no-gutters ms-1 me-1 dense-4 padding-top_5">
        <mat-form-field appearance="outline" class="col-3 px-1">
          <mat-label>Attachment Name</mat-label>
          <input type="text" matInput formControlName="attachmentName" />
        </mat-form-field>

        <div class="col-2 px-1 margin-top_5">
          <input type="file" id="file1" [disabled]="disableButtons"
            (change)="handleAttachmentFileInput($event)" />
        </div>

        <div class="col-4 px-1 margin-top_5">
          <button mat-raised-button class="submitButton" [disabled]="disableButtons"
            (click)="onCreateSelectedAttachmentList()">
            Add Row
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="example-table-container">
  <mat-card class="bg-color_#fdfdf margin-top_2" *ngIf="this.UserRoleAttachmentTable.length > 0">
    <mat-table [dataSource]="tableAttachmentData" class="bg-color_ghost_White" matSort>
      <ng-container matColumnDef="attachmentName">
        <mat-header-cell *matHeaderCellDef>Attachment Name</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.attachmentName }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="categoryTypes">
        <mat-header-cell *matHeaderCellDef>Category Types</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.categoryTypes }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="removeRow">
        <mat-header-cell *matHeaderCellDef>Action</mat-header-cell>
        <mat-cell *matCellDef="let row">
          <button mat-icon-button color="warn" (click)="attachedRemoveRow(row)">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="AddedAttachmentisplayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: AddedAttachmentisplayedColumns"></mat-row>
    </mat-table>
  </mat-card>
</div>

<!-- Remaining code unchanged -->
<app-common-comments [nextStageListData]="nextStageListData"
  (commentsData)="handleCommentsForm($event)"></app-common-comments>

<div class="containerBTN margin-top_2 margin-bottom_35">
  <div class="d-flex justify-content-center">
    <button mat-raised-button class="submitButton" (click)="onSaveConfirmation()" [disabled]="disableButtons">
      Save
    </button>
    <button mat-raised-button class="submitButton" (click)="onSubmitConfirmation()" [disabled]="disableButtons">
      Submit
    </button>
  </div>
</div>

<mat-spinner *ngIf="isLoading" class="global-loading-spinner"></mat-spinner>
<div class="height_5"></div>
