<div class="adjust">
    <div class="example-table-container">
        <app-common-header [pageData]="this.pageData" (headerData)="getHeaderData($event)"></app-common-header>
    </div>
</div>
<div class="table-box">
    <div class="section_header_child_1">
        <div class="float-start">Product Information</div>
        <div class="float-end">
            <button mat-raised-button class="section-add-new-record-btn" (click)="addProduct()">
                Add Product
            </button>
        </div>
    </div>
</div>
<form [formGroup]="SPMRequirementForm">
    <div formArrayName="products">

        <div *ngFor="let item of products.controls; let i = index" [formGroupName]="i">

            <!-- Header -->
            <div class="table-box">
                <div class="section_header_child_1">
                    <div class="float-start">
                        Product - {{ i + 1 }}
                    </div>
                    <div class="float-end">
                        <button mat-raised-button class="section-add-remove-record-btn" *ngIf="i > 0"
                            (click)="removeProduct(i)">
                            Delete
                        </button>
                    </div>
                </div>
            </div>       

            <!-- Row 1 -->
            <div class="row no-gutters ms-1 me-1 dense-4">
                <mat-form-field appearance="outline" class="col-3 px-1">
                    <mat-label>Product Number</mat-label>
                    <input matInput formControlName="productNo">
                    <img src="assets/searchfind.svg" class="lovSearchButton" (click)="openStatusLOV(i)">
                </mat-form-field>
                <mat-form-field appearance="outline" class="col-3 px-1">
                    <mat-label>Product Name</mat-label>
                    <input type="text" matInput formControlName="productName" placeholder="Product Name" />
                </mat-form-field>
                <mat-form-field appearance="outline" class="col-3 px-1">
                    <mat-label>Market</mat-label>
                    <input type="text" matInput formControlName="market" placeholder="Market" />
                </mat-form-field>
                <mat-form-field appearance="outline" class="col-3 px-1">
                    <mat-label>Product Code</mat-label>
                    <input type="text" matInput formControlName="productCode" placeholder="Product Code" />
                </mat-form-field>
                <mat-form-field appearance="outline" class="col-3 px-1">
                    <mat-label>UOM</mat-label>
                    <input type="text" matInput formControlName="uom" placeholder="UOM" />
                </mat-form-field>
                <mat-form-field appearance="outline" class="col-3 px-1">
                    <mat-label>Shelf Life in Months</mat-label>
                    <input type="text" matInput formControlName="shelfLifeMonths" placeholder="Shelf Life in Months" />
                </mat-form-field>
                <mat-form-field appearance="outline" class="col-3 px-1">
                    <mat-label>Product Type</mat-label>
                    <input type="text" matInput formControlName="productType" placeholder="Product Type" />
                </mat-form-field>
                <mat-form-field appearance="outline" class="col-3 px-1">
                    <mat-label>Dosage Form</mat-label>
                    <input type="text" matInput formControlName="dosageForm" placeholder="Dosage Form" />
                </mat-form-field>
                <mat-form-field appearance="outline" class="col-3 px-1">
                    <mat-label>Input Code</mat-label>
                    <input type="text" matInput formControlName="inputCode" placeholder="Input Code" />
                </mat-form-field>
                <mat-form-field appearance="outline" class="col-3 px-1">
                    <mat-label>Product Tracking Code</mat-label>
                    <input type="text" matInput formControlName="productTrackingCode"
                        placeholder="Product Tracking Code" />
                </mat-form-field>
            </div>          
        </div>

    </div>
</form>
<form [formGroup]="ContainerRequirementForm">
    <div formArrayName="containers">     
        <table class="display-table  no-gutters ms-1 me-1 dense-4" id="dataTable">
            <thead>
                <tr>
                    <th></th>
                    <th>Material Number</th>
                    <th>Material Name</th>
                    <th>Material Code</th>
                    <th>Weight</th>
                    <th>UOM</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of containers.controls; let idx = index"  [formGroupName]="idx">
                    <td class="">
                        <img src="/assets/delete.png" (click)="removeContainer(idx)" />
                    </td>
                    <td>
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>Material Number</mat-label>
                            <input type="text" matInput formControlName="materialNo" placeholder="Material Number"
                                (change)="onChangeMaterialNo(idx)" />
                            <img alt="lov img" src="../../../../../../assets/searchfind.svg"
                                class="icon-size lovSearchButton" color="primary" (click)="openMaterialListLOV(idx)" />
                        </mat-form-field>
                    </td>
                    <td class="">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>Material Name</mat-label>
                            <input type="text" matInput formControlName="materialName"
                                (change)="onChangeMaterialName(idx)" placeholder="Material Name" />
                            <img alt="lov img" src="../../../../../../assets/searchfind.svg"
                                class="icon-size lovSearchButton" color="primary" (click)="openMaterialListLOV(idx)" />
                        </mat-form-field>
                    </td>
                    <td class="">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>Material Code</mat-label>
                            <input type="text" matInput formControlName="materialCode"
                                (change)="onChangeByMaterialCode(idx)" placeholder="Material Code" />
                            <img alt="lov img" src="../../../../../../assets/searchfind.svg"
                                class="icon-size lovSearchButton" color="primary" (click)="openMaterialListLOV(idx)" />
                        </mat-form-field>
                    </td>
                    <td class="">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>Weight</mat-label>
                            <input type="text" formControlName="weight" matInput placeholder="Weight" />
                        </mat-form-field>
                    </td>
                    <td class="">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-label>UOM</mat-label>
                            <mat-select formControlName="weightUom">
                                <mat-option value="">Select</mat-option>
                                <mat-option value="KG">KG</mat-option>
                                <mat-option value="GM">GM</mat-option>
                                <mat-option value="L">L</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </td>
                </tr>
            </tbody>
        </table>


    </div>
</form>
