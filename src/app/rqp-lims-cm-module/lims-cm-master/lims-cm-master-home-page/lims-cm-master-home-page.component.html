<div style="margin-top: 5px; margin-left: 5px">
  <mat-grid-list cols="4" rowHeight="3:1" class="mastermatgridlist">
    <mat-grid-tile>
      <button mat-raised-button class="tile-view" (click)="onCciMaster()">
        Column Code Index Master
      </button>
    </mat-grid-tile>
    <mat-grid-tile>
      <button mat-raised-button class="tile-view" (click)="onClMaster()">
        Column Lot Master
      </button>
    </mat-grid-tile>
    <mat-grid-tile>
      <button mat-raised-button class="tile-view" (click)="onColumnMaster()">
        Column Master
      </button>
    </mat-grid-tile>
    <mat-grid-tile>
        <button mat-raised-button class="tile-view" (click)="onCompletedDashboard()">
          Completed
        </button>
      </mat-grid-tile>
      <mat-grid-tile>
        <button mat-raised-button class="tile-view" (click)="onPendingDashboard()">
          Pending
        </button>
      </mat-grid-tile>
  </mat-grid-list>
</div>
